<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bruno Dog</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #status {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: none;
      padding: 7px 9px;
      border-radius: 6px;
      background: rgba(0,0,0,.75);
      color: white;
      font: 12px/1.35 system-ui, sans-serif;
    }

    body.error #status { display: block; }

    #debug {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 10;
      display: none;
      gap: 5px;
    }

    body.debug #debug { display: flex; }

    #debug button {
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(255,255,255,.9);
      color: #111;
      cursor: pointer;
      font: 12px system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <div id="debug">
    <button data-state="motion">Motion</button>
    <button data-state="center">Center</button>
    <button data-state="vfx">VFX</button>
  </div>

  <div id="status">Could not load the 3D dog.</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm';

    const CONFIG = {
      modelFile: './head.glb?v=4',

      // Head movement
      cursorYaw: THREE.MathUtils.degToRad(10),
      cursorPitch: THREE.MathUtils.degToRad(6),
      cursorRoll: THREE.MathUtils.degToRad(2),
      sectionYaw: THREE.MathUtils.degToRad(6),

      // Confirmed Blender pupil axes:
      // X = depth, Y = left/right, Z = up/down
      pupilTravelY: 0.055,
      pupilTravelZ: 0.040,
      pupilSectionBias: 0.015,

      // Smoothing
      dogSmooth: 2.8,
      pupilSmooth: 12.5,

      // Framing
      modelScale: 1.0,
      cameraPadding: 1.24,

      // Subtle idle life
      idleFloat: 0.010,
      idleSpeed: 1.05,
      idleYaw: THREE.MathUtils.degToRad(0.9),
      idlePitch: THREE.MathUtils.degToRad(0.7),
      idleRoll: THREE.MathUtils.degToRad(0.6)
    };

    const status = document.querySelector('#status');
    const params = new URLSearchParams(location.search);

    if (params.get('debug') === '1') {
      document.body.classList.add('debug');
    }

    const scene = new THREE.Scene();

    // Dog is exported upright, looking toward +X, with Z as vertical.
    const camera = new THREE.PerspectiveCamera(27, 1, 0.01, 100);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // Preserve the graphic Blender colors as closely as possible.
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.toneMappingExposure = 1.0;

    document.body.prepend(renderer.domElement);

    // Helps only if some exported material isn't emissive.
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    let dogRoot = null;
    let dogHead = null;
    let eyeL = null;
    let eyeR = null;
    let nose = null;
    let pupilL = null;
    let pupilR = null;

    const base = {
      dogRotation: new THREE.Euler(),
      pupilLPosition: new THREE.Vector3(),
      pupilRPosition: new THREE.Vector3()
    };

    const pointer = new THREE.Vector2(0, 0);
    const currentDog = new THREE.Vector2(0, 0);
    let currentRoll = 0;
    let section = 'center';

    function showError(message) {
      console.error(message);
      status.textContent = message;
      document.body.classList.add('error');
    }

    function fitCameraToObject(object) {
      object.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      object.position.sub(center);
      object.updateMatrixWorld(true);

      const maxSize = Math.max(size.x, size.y, size.z);
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const distance =
        (maxSize * CONFIG.cameraPadding) /
        (2 * Math.tan(fov / 2));

      camera.position.set(distance, 0, 0);
      camera.lookAt(0, 0, 0);

      camera.near = Math.max(distance / 100, 0.01);
      camera.far = distance * 20;
      camera.updateProjectionMatrix();
    }

    new GLTFLoader().load(
      CONFIG.modelFile,

      (gltf) => {
        const model = gltf.scene;
        model.scale.setScalar(CONFIG.modelScale);
        modelRoot.add(model);

        dogRoot = model.getObjectByName('Dog_Root');
        dogHead = model.getObjectByName('Dog_Head');
        eyeL = model.getObjectByName('Eye_L');
        eyeR = model.getObjectByName('Eye_R');
        nose = model.getObjectByName('Nose');
        pupilL = model.getObjectByName('Pupil_L');
        pupilR = model.getObjectByName('Pupil_R');

        if (!dogRoot || !dogHead || !eyeL || !eyeR || !pupilL || !pupilR) {
          showError(
            'GLB loaded, but one or more objects were not found: Dog_Root, Dog_Head, Eye_L, Eye_R, Pupil_L, Pupil_R.'
          );
          return;
        }

        // No forced 90° rotation and no material replacement.
        base.dogRotation.copy(dogRoot.rotation);
        base.pupilLPosition.copy(pupilL.position);
        base.pupilRPosition.copy(pupilR.position);

        fitCameraToObject(modelRoot);

        console.log('Dog loaded successfully.', {
          dogRoot,
          dogHead,
          eyeL,
          eyeR,
          nose,
          pupilL,
          pupilR
        });
      },

      undefined,

      (error) => {
        console.error(error);
        showError('Could not load head.glb.');
      }
    );

    function setSection(value) {
      section = ['motion', 'vfx', 'center'].includes(value)
        ? value
        : 'center';
    }

    setSection(params.get('state') || 'center');

    document.querySelectorAll('[data-state]').forEach((button) => {
      button.addEventListener('click', () => {
        setSection(button.dataset.state);
      });
    });

    // Standalone GitHub Pages pointer.
    window.addEventListener(
      'pointermove',
      (event) => {
        pointer.x = THREE.MathUtils.clamp(
          (event.clientX / innerWidth) * 2 - 1,
          -1,
          1
        );

        pointer.y = THREE.MathUtils.clamp(
          -((event.clientY / innerHeight) * 2 - 1),
          -1,
          1
        );
      },
      { passive: true }
    );

    window.addEventListener('pointerleave', () => {
      pointer.set(0, 0);
    });

    // Pointer + state coming from Cargo.
    window.addEventListener('message', (event) => {
      const data = event.data;

      if (!data || typeof data !== 'object') return;

      if (data.type === 'bruno-pointer') {
        pointer.x = THREE.MathUtils.clamp(Number(data.x) || 0, -1, 1);
        pointer.y = THREE.MathUtils.clamp(Number(data.y) || 0, -1, 1);
      }

      if (data.type === 'bruno-character') {
        setSection(data.state);
      }
    });

    function damp(current, target, speed, delta) {
      return THREE.MathUtils.damp(current, target, speed, delta);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      const now = performance.now() / 1000;

      if (dogRoot && pupilL && pupilR) {
        const sectionBias =
          section === 'motion'
            ? CONFIG.sectionYaw
            : section === 'vfx'
              ? -CONFIG.sectionYaw
              : 0;

        const targetYaw =
          sectionBias + pointer.x * CONFIG.cursorYaw;

        const targetPitch =
          pointer.y * CONFIG.cursorPitch;

        const targetRoll =
          -pointer.x * CONFIG.cursorRoll
          + Math.sin(now * 0.45) * THREE.MathUtils.degToRad(0.35);

        currentDog.x = damp(
          currentDog.x,
          targetYaw,
          CONFIG.dogSmooth,
          delta
        );

        currentDog.y = damp(
          currentDog.y,
          targetPitch,
          CONFIG.dogSmooth,
          delta
        );

        currentRoll = damp(
          currentRoll,
          targetRoll,
          CONFIG.dogSmooth * 0.8,
          delta
        );

        const idleYaw =
          Math.sin(now * 0.70) * CONFIG.idleYaw;

        const idlePitch =
          Math.sin(now * 0.91 + 0.8) * CONFIG.idlePitch;

        const idleRoll =
          Math.sin(now * 0.57 + 1.3) * CONFIG.idleRoll;

        /*
          Dog export orientation:
          - Z rotation = left/right turning
          - Y rotation = up/down response
          - X rotation = subtle roll
        */
        dogRoot.rotation.z =
          base.dogRotation.z +
          currentDog.x +
          idleYaw;

        dogRoot.rotation.y =
          base.dogRotation.y -
          currentDog.y +
          idlePitch;

        dogRoot.rotation.x =
          base.dogRotation.x +
          currentRoll +
          idleRoll;

        const sectionPupilBias =
          section === 'motion'
            ? CONFIG.pupilSectionBias
            : section === 'vfx'
              ? -CONFIG.pupilSectionBias
              : 0;

        /*
          Confirmed in Blender:
          local/global X = depth
          Y = left/right
          Z = up/down

          So we never use X for cursor movement.
        */
        const pupilY = THREE.MathUtils.clamp(
          pointer.x * CONFIG.pupilTravelY + sectionPupilBias,
          -CONFIG.pupilTravelY,
          CONFIG.pupilTravelY
        );

        const pupilZ = THREE.MathUtils.clamp(
          pointer.y * CONFIG.pupilTravelZ,
          -CONFIG.pupilTravelZ,
          CONFIG.pupilTravelZ
        );

        pupilL.position.y = damp(
          pupilL.position.y,
          base.pupilLPosition.y + pupilY,
          CONFIG.pupilSmooth,
          delta
        );

        pupilL.position.z = damp(
          pupilL.position.z,
          base.pupilLPosition.z + pupilZ,
          CONFIG.pupilSmooth,
          delta
        );

        pupilR.position.y = damp(
          pupilR.position.y,
          base.pupilRPosition.y + pupilY,
          CONFIG.pupilSmooth,
          delta
        );

        pupilR.position.z = damp(
          pupilR.position.z,
          base.pupilRPosition.z + pupilZ,
          CONFIG.pupilSmooth,
          delta
        );

        // Keep original depth so pupils stay on the eye planes.
        pupilL.position.x = base.pupilLPosition.x;
        pupilR.position.x = base.pupilRPosition.x;

        // Small idle float for life, without changing orientation.
        modelRoot.position.z =
          Math.sin(now * CONFIG.idleSpeed) *
          CONFIG.idleFloat;

        modelRoot.position.y =
          Math.sin(now * CONFIG.idleSpeed * 0.73 + 0.9) *
          CONFIG.idleFloat *
          0.35;

        // Tiny forward/back "breathing" motion.
        modelRoot.position.x =
          Math.sin(now * CONFIG.idleSpeed * 0.52 + 0.4) *
          CONFIG.idleFloat *
          0.18;
      }

      renderer.render(scene, camera);
    }

    function resize() {
      const width = Math.max(innerWidth, 1);
      const height = Math.max(innerHeight, 1);

      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    addEventListener('resize', resize);

    resize();
    animate();
  </script>
</body>
</html>
