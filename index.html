<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bruno Star</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #status {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: none;
      padding: 7px 9px;
      border-radius: 6px;
      background: rgba(0,0,0,.75);
      color: white;
      font: 12px/1.35 system-ui, sans-serif;
    }
    body.error #status { display: block; }
    #debug {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 10;
      display: none;
      gap: 5px;
    }
    body.debug #debug { display: flex; }
    #debug button {
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(255,255,255,.9);
      color: #111;
      cursor: pointer;
      font: 12px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="debug">
    <button data-state="motion">Motion</button>
    <button data-state="center">Center</button>
    <button data-state="vfx">VFX</button>
  </div>
  <div id="status">Could not load the 3D star.</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm';

    const CONFIG = {
      modelFile: './head.glb',
      cursorYaw: THREE.MathUtils.degToRad(5),
      cursorPitch: THREE.MathUtils.degToRad(3),
      sectionYaw: THREE.MathUtils.degToRad(8),
      pupilTravelX: 0.12,
      pupilTravelZ: 0.09,
      pupilSectionBias: 0.055,
      starSmooth: 3.0,
      pupilSmooth: 9.0,
      modelScale: 1,
      cameraPadding: 1.18,
      idleAmount: 0.012,
      idleSpeed: 1.15
    };

    const status = document.querySelector('#status');
    const params = new URLSearchParams(location.search);
    if (params.get('debug') === '1') document.body.classList.add('debug');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(27, 1, 0.01, 100);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    let starRoot = null;
    let eyeL = null;
    let eyeR = null;
    let pupilL = null;
    let pupilR = null;

    const base = {
      starRotation: new THREE.Euler(),
      pupilLPosition: new THREE.Vector3(),
      pupilRPosition: new THREE.Vector3()
    };

    const pointer = new THREE.Vector2(0, 0);
    const currentStar = new THREE.Vector2(0, 0);
    let section = 'center';

    function fitCameraToObject(object) {
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      object.position.sub(center);
      object.updateMatrixWorld(true);

      const maxSize = Math.max(size.x, size.y, size.z);
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const distance = (maxSize * CONFIG.cameraPadding) / (2 * Math.tan(fov / 2));

      camera.position.set(distance, 0, 0);
      camera.lookAt(0, 0, 0);
      camera.near = Math.max(distance / 100, 0.01);
      camera.far = distance * 20;
      camera.updateProjectionMatrix();
    }

    function showError(message) {
      console.error(message);
      status.textContent = message;
      document.body.classList.add('error');
    }

    new GLTFLoader().load(
      CONFIG.modelFile,
      (gltf) => {
        const model = gltf.scene;
        model.scale.setScalar(CONFIG.modelScale);
        modelRoot.add(model);

        starRoot = model.getObjectByName('Star_Root');

        // Correct the Blender export orientation so the eyes sit horizontally.
        starRoot.rotation.x += THREE.MathUtils.degToRad(90);

        eyeL = model.getObjectByName('Eye_L');
        eyeR = model.getObjectByName('Eye_R');
        pupilL = model.getObjectByName('Pupil_L');
        pupilR = model.getObjectByName('Pupil_R');

        if (!starRoot || !eyeL || !eyeR || !pupilL || !pupilR) {
          showError('GLB loaded, but one of these objects was not found: Star_Root, Eye_L, Eye_R, Pupil_L, Pupil_R.');
          return;
        }

        base.starRotation.copy(starRoot.rotation);
        base.pupilLPosition.copy(pupilL.position);
        base.pupilRPosition.copy(pupilR.position);

        fitCameraToObject(modelRoot);
        console.log('Star loaded successfully!', { starRoot, eyeL, eyeR, pupilL, pupilR });
      },
      undefined,
      (error) => {
        console.error(error);
        showError('Could not load head.glb.');
      }
    );

    function setSection(value) {
      section = ['motion', 'vfx', 'center'].includes(value) ? value : 'center';
    }

    setSection(params.get('state') || 'center');

    document.querySelectorAll('[data-state]').forEach((button) => {
      button.addEventListener('click', () => setSection(button.dataset.state));
    });

    window.addEventListener('pointermove', (event) => {
      pointer.x = THREE.MathUtils.clamp((event.clientX / innerWidth) * 2 - 1, -1, 1);
      pointer.y = THREE.MathUtils.clamp(-((event.clientY / innerHeight) * 2 - 1), -1, 1);
    }, { passive: true });

    window.addEventListener('pointerleave', () => pointer.set(0, 0));

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'bruno-pointer') {
        pointer.x = THREE.MathUtils.clamp(Number(data.x) || 0, -1, 1);
        pointer.y = THREE.MathUtils.clamp(Number(data.y) || 0, -1, 1);
      }

      if (data.type === 'bruno-character') {
        setSection(data.state);
      }
    });

    function damp(current, target, speed, delta) {
      return THREE.MathUtils.damp(current, target, speed, delta);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const now = performance.now() / 1000;

      if (starRoot && pupilL && pupilR) {
        const sectionBias =
          section === 'motion' ? -CONFIG.sectionYaw :
          section === 'vfx' ? CONFIG.sectionYaw : 0;

        const targetYaw = sectionBias + pointer.x * CONFIG.cursorYaw;
        const targetPitch = pointer.y * CONFIG.cursorPitch;

        currentStar.x = damp(currentStar.x, targetYaw, CONFIG.starSmooth, delta);
        currentStar.y = damp(currentStar.y, targetPitch, CONFIG.starSmooth, delta);

        starRoot.rotation.y = base.starRotation.y - currentStar.y;
        starRoot.rotation.z = base.starRotation.z + currentStar.x;

        const sectionPupilBias =
          section === 'motion' ? -CONFIG.pupilSectionBias :
          section === 'vfx' ? CONFIG.pupilSectionBias : 0;

        const pupilX = THREE.MathUtils.clamp(
          pointer.x * CONFIG.pupilTravelX + sectionPupilBias,
          -CONFIG.pupilTravelX,
          CONFIG.pupilTravelX
        );

        const pupilZ = THREE.MathUtils.clamp(
          pointer.y * CONFIG.pupilTravelZ,
          -CONFIG.pupilTravelZ,
          CONFIG.pupilTravelZ
        );

        pupilL.position.y = damp(
          pupilL.position.y,
          base.pupilLPosition.y + pupilX,
          CONFIG.pupilSmooth,
          delta
        );
        pupilL.position.z = damp(
          pupilL.position.z,
          base.pupilLPosition.z + pupilZ,
          CONFIG.pupilSmooth,
          delta
        );
        pupilR.position.y = damp(
          pupilR.position.y,
          base.pupilRPosition.y + pupilX,
          CONFIG.pupilSmooth,
          delta
        );
        pupilR.position.z = damp(
          pupilR.position.z,
          base.pupilRPosition.z + pupilZ,
          CONFIG.pupilSmooth,
          delta
        );

        pupilL.position.x = base.pupilLPosition.x;
        pupilR.position.x = base.pupilRPosition.x;

        modelRoot.position.z = Math.sin(now * CONFIG.idleSpeed) * CONFIG.idleAmount;
      }

      renderer.render(scene, camera);
    }

    function resize() {
      const width = Math.max(innerWidth, 1);
      const height = Math.max(innerHeight, 1);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    addEventListener('resize', resize);
    resize();
    animate();
  </script>
</body>
</html>
