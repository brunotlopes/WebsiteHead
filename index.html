<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bruno Dog</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #status {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: none;
      padding: 7px 9px;
      border-radius: 6px;
      background: rgba(0,0,0,.75);
      color: white;
      font: 12px/1.35 system-ui, sans-serif;
    }

    body.error #status { display: block; }

    #debug {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 10;
      display: none;
      gap: 5px;
    }

    body.debug #debug { display: flex; }

    #debug button {
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(255,255,255,.9);
      color: #111;
      cursor: pointer;
      font: 12px system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <div id="debug">
    <button data-state="motion">Motion</button>
    <button data-state="center">Center</button>
    <button data-state="vfx">VFX</button>
  </div>

  <div id="status">Could not load the 3D dog.</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm';

    const CONFIG = {
      modelFile: './head.glb',

      // Dog movement
      cursorYaw: THREE.MathUtils.degToRad(7),
      cursorPitch: THREE.MathUtils.degToRad(4),
      sectionYaw: THREE.MathUtils.degToRad(9),

      // Eye movement
      pupilTravelHorizontal: 0.055,
      pupilTravelVertical: 0.04,
      pupilSectionBias: 0.025,

      // Eyes react faster than the head
      dogSmooth: 3.2,
      pupilSmooth: 10.0,

      // Framing
      modelScale: 1,
      cameraPadding: 1.22,

      // Very subtle idle float
      idleAmount: 0.008,
      idleSpeed: 1.0
    };

    const status = document.querySelector('#status');
    const params = new URLSearchParams(location.search);

    if (params.get('debug') === '1') {
      document.body.classList.add('debug');
    }

    const scene = new THREE.Scene();

    // Blender model is viewed from +X, with Z as vertical.
    const camera = new THREE.PerspectiveCamera(27, 1, 0.01, 100);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    document.body.prepend(renderer.domElement);

    // Emission materials do not need lighting, but this helps if any material is not emissive.
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    let dogRoot = null;
    let dogHead = null;
    let eyeL = null;
    let eyeR = null;
    let nose = null;
    let pupilL = null;
    let pupilR = null;

    const base = {
      dogRotation: new THREE.Euler(),
      pupilLPosition: new THREE.Vector3(),
      pupilRPosition: new THREE.Vector3()
    };

    const pointer = new THREE.Vector2(0, 0);
    const currentDog = new THREE.Vector2(0, 0);

    let section = 'center';

    function showError(message) {
      console.error(message);
      status.textContent = message;
      document.body.classList.add('error');
    }

    function fitCameraToObject(object) {
      object.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      object.position.sub(center);
      object.updateMatrixWorld(true);

      const maxSize = Math.max(size.x, size.y, size.z);
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const distance =
        (maxSize * CONFIG.cameraPadding) /
        (2 * Math.tan(fov / 2));

      camera.position.set(distance, 0, 0);
      camera.lookAt(0, 0, 0);

      camera.near = Math.max(distance / 100, 0.01);
      camera.far = distance * 20;
      camera.updateProjectionMatrix();
    }

    new GLTFLoader().load(
      CONFIG.modelFile,

      (gltf) => {
        const model = gltf.scene;

        model.scale.setScalar(CONFIG.modelScale);
        modelRoot.add(model);

        // Names taken from the Blender Dog hierarchy.
        dogRoot = model.getObjectByName('Dog_Root');
        dogHead = model.getObjectByName('Dog_Head');
        eyeL = model.getObjectByName('Eye_L');
        eyeR = model.getObjectByName('Eye_R');
        nose = model.getObjectByName('Nose');
        pupilL = model.getObjectByName('Pupil_L');
        pupilR = model.getObjectByName('Pupil_R');

        if (!dogRoot || !dogHead || !eyeL || !eyeR || !pupilL || !pupilR) {
          showError(
            'GLB loaded, but one of these objects was not found: Dog_Root, Dog_Head, Eye_L, Eye_R, Pupil_L, Pupil_R.'
          );
          return;
        }

        // Keep Blender materials exactly as exported.
        base.dogRotation.copy(dogRoot.rotation);
        base.pupilLPosition.copy(pupilL.position);
        base.pupilRPosition.copy(pupilR.position);

        fitCameraToObject(modelRoot);

        console.log('Dog loaded successfully!', {
          dogRoot,
          dogHead,
          eyeL,
          eyeR,
          nose,
          pupilL,
          pupilR
        });
      },

      undefined,

      (error) => {
        console.error(error);
        showError('Could not load head.glb.');
      }
    );

    function setSection(value) {
      section = ['motion', 'vfx', 'center'].includes(value)
        ? value
        : 'center';
    }

    setSection(params.get('state') || 'center');

    document.querySelectorAll('[data-state]').forEach((button) => {
      button.addEventListener('click', () => {
        setSection(button.dataset.state);
      });
    });

    // Pointer when testing the GitHub page directly.
    window.addEventListener(
      'pointermove',
      (event) => {
        pointer.x = THREE.MathUtils.clamp(
          (event.clientX / innerWidth) * 2 - 1,
          -1,
          1
        );

        pointer.y = THREE.MathUtils.clamp(
          -((event.clientY / innerHeight) * 2 - 1),
          -1,
          1
        );
      },
      { passive: true }
    );

    window.addEventListener('pointerleave', () => {
      pointer.set(0, 0);
    });

    // Pointer and category state sent by Cargo.
    window.addEventListener('message', (event) => {
      const data = event.data;

      if (!data || typeof data !== 'object') return;

      if (data.type === 'bruno-pointer') {
        pointer.x = THREE.MathUtils.clamp(Number(data.x) || 0, -1, 1);
        pointer.y = THREE.MathUtils.clamp(Number(data.y) || 0, -1, 1);
      }

      if (data.type === 'bruno-character') {
        setSection(data.state);
      }
    });

    function damp(current, target, speed, delta) {
      return THREE.MathUtils.damp(current, target, speed, delta);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      const now = performance.now() / 1000;

      if (dogRoot && pupilL && pupilR) {
        const sectionBias =
          section === 'motion'
            ? -CONFIG.sectionYaw
            : section === 'vfx'
              ? CONFIG.sectionYaw
              : 0;

        const targetHorizontal =
          sectionBias + pointer.x * CONFIG.cursorYaw;

        const targetVertical =
          pointer.y * CONFIG.cursorPitch;

        currentDog.x = damp(
          currentDog.x,
          targetHorizontal,
          CONFIG.dogSmooth,
          delta
        );

        currentDog.y = damp(
          currentDog.y,
          targetVertical,
          CONFIG.dogSmooth,
          delta
        );

        /*
          Dog faces along X.
          Z rotation gives horizontal turning in this exported orientation.
          Y gives the subtle vertical reaction.
        */
        dogRoot.rotation.z =
          base.dogRotation.z + currentDog.x;

        dogRoot.rotation.y =
          base.dogRotation.y - currentDog.y;

        const sectionPupilBias =
          section === 'motion'
            ? -CONFIG.pupilSectionBias
            : section === 'vfx'
              ? CONFIG.pupilSectionBias
              : 0;

        const pupilHorizontal = THREE.MathUtils.clamp(
          pointer.x * CONFIG.pupilTravelHorizontal + sectionPupilBias,
          -CONFIG.pupilTravelHorizontal,
          CONFIG.pupilTravelHorizontal
        );

        const pupilVertical = THREE.MathUtils.clamp(
          pointer.y * CONFIG.pupilTravelVertical,
          -CONFIG.pupilTravelVertical,
          CONFIG.pupilTravelVertical
        );

        // In this Blender orientation: Y = horizontal, Z = vertical.
        pupilL.position.y = damp(
          pupilL.position.y,
          base.pupilLPosition.y + pupilHorizontal,
          CONFIG.pupilSmooth,
          delta
        );

        pupilL.position.z = damp(
          pupilL.position.z,
          base.pupilLPosition.z + pupilVertical,
          CONFIG.pupilSmooth,
          delta
        );

        pupilR.position.y = damp(
          pupilR.position.y,
          base.pupilRPosition.y + pupilHorizontal,
          CONFIG.pupilSmooth,
          delta
        );

        pupilR.position.z = damp(
          pupilR.position.z,
          base.pupilRPosition.z + pupilVertical,
          CONFIG.pupilSmooth,
          delta
        );

        // Preserve pupil depth.
        pupilL.position.x = base.pupilLPosition.x;
        pupilR.position.x = base.pupilRPosition.x;

        modelRoot.position.z =
          Math.sin(now * CONFIG.idleSpeed) * CONFIG.idleAmount;
      }

      renderer.render(scene, camera);
    }

    function resize() {
      const width = Math.max(innerWidth, 1);
      const height = Math.max(innerHeight, 1);

      renderer.setSize(width, height, false);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    addEventListener('resize', resize);

    resize();
    animate();
  </script>
</body>
</html>
