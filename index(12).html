<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bruno Head</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #status {
      position: absolute;
      inset: auto 8px 8px 8px;
      z-index: 2;
      display: none;
      padding: 7px 9px;
      border-radius: 6px;
      background: rgba(0,0,0,.7);
      color: white;
      font: 12px/1.35 system-ui, sans-serif;
    }
    body.error #status { display: block; }

    /* Só aparece ao abrir com ?debug=1 */
    #debug {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      display: none;
      gap: 5px;
    }
    body.debug #debug { display: flex; }
    #debug button {
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(255,255,255,.85);
      color: #111;
      cursor: pointer;
      font: 12px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="debug">
    <button data-state="motion">Motion</button>
    <button data-state="center">Centro</button>
    <button data-state="vfx">VFX</button>
  </div>
  <div id="status">Não foi possível carregar o personagem 3D.</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm';

    /* =========================================
       AJUSTES PRINCIPAIS
       Você pode alterar estes valores depois.
    ========================================== */
    const CONFIG = {
      modelFile: './head.glb',

      // Rotação máxima causada pelo cursor.
      cursorYaw: THREE.MathUtils.degToRad(9),
      cursorPitch: THREE.MathUtils.degToRad(5),

      // Viés ao selecionar Motion ou VFX.
      sectionYaw: THREE.MathUtils.degToRad(13),

      // Os olhos reagem um pouco mais que a cabeça.
      eyeExtraYaw: THREE.MathUtils.degToRad(5),
      eyeExtraPitch: THREE.MathUtils.degToRad(3),

      // Deslocamento real das pupilas sobre os planos dos olhos.
      pupilTravel: 0.24,
      pupilSectionBias: 0.11,

      // Suavização. Quanto maior, mais rápido responde.
      headSmooth: 6.5,
      eyeSmooth: 9.5,

      // Enquadramento.
      modelScale: 1.0,
      cameraPadding: 1.27,

      // Piscar. Coloque false caso não goste do resultado.
      blinkEnabled: true,
      blinkMinSeconds: 3.2,
      blinkMaxSeconds: 6.5,

      // Materiais simples e leves.
      colors: {
        head: 0xe8dfcf,
        eyes: 0xf5f1e9,
        pupils: 0x252421
      }
    };

    const status = document.querySelector('#status');
    const params = new URLSearchParams(location.search);
    if (params.get('debug') === '1') document.body.classList.add('debug');

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(27, 1, 0.01, 100);
    camera.up.set(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.prepend(renderer.domElement);

    // Luz macia, sem sombras pesadas.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x6e7180, 2.15));

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.0);
    keyLight.position.set(4, 5, 4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xaec8ff, 1.35);
    fillLight.position.set(3, 1, -5);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffd7b2, 1.0);
    rimLight.position.set(-4, 3, 1);
    scene.add(rimLight);

    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    let head = null;
    let eyeL = null;
    let eyeR = null;
    let pupilL = null;
    let pupilR = null;

    const base = {
      headRotation: new THREE.Euler(),
      eyeLRotation: new THREE.Euler(),
      eyeRRotation: new THREE.Euler(),
      eyeLScale: new THREE.Vector3(1,1,1),
      eyeRScale: new THREE.Vector3(1,1,1),
      pupilLPosition: new THREE.Vector3(),
      pupilRPosition: new THREE.Vector3()
    };

    const pointer = new THREE.Vector2(0, 0);
    const currentHead = new THREE.Vector2(0, 0);
    const currentEyes = new THREE.Vector2(0, 0);
    let section = 'center';
    let blinkAmount = 0;
    let nextBlinkAt = 0;
    let blinkStartedAt = -1;

    function material(color, roughness = .78, metalness = 0) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness,
        flatShading: true
      });
    }

    const materials = {
      head: material(CONFIG.colors.head, .84),
      eyes: material(CONFIG.colors.eyes, .58),
      pupils: material(CONFIG.colors.pupils, .42)
    };

    function assignMaterial(node, mat) {
      node?.traverse((child) => {
        if (!child.isMesh) return;
        child.material = mat.clone();
        child.material.needsUpdate = true;
      });
    }

    function fitCameraToObject(object) {
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      // Centraliza o modelo no grupo sem alterar a hierarquia interna.
      object.position.sub(center);
      object.updateMatrixWorld(true);

      const maxSize = Math.max(size.x, size.y, size.z);
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const distance = (maxSize * CONFIG.cameraPadding) / (2 * Math.tan(fov / 2));

      // O seu modelo olha para +X. A câmera fica na frente dele.
      camera.position.set(distance, size.y * 0.05, 0);
      camera.lookAt(0, 0, 0);
      camera.near = Math.max(distance / 100, .01);
      camera.far = distance * 20;
      camera.updateProjectionMatrix();
    }

    function showError(message) {
      console.error(message);
      status.textContent = message;
      document.body.classList.add('error');
    }

    new GLTFLoader().load(
      CONFIG.modelFile,
      (gltf) => {
        const model = gltf.scene;
        model.scale.setScalar(CONFIG.modelScale);
        modelRoot.add(model);

        head = model.getObjectByName('Head');
        eyeL = model.getObjectByName('Eye_L');
        eyeR = model.getObjectByName('Eye_R');
        pupilL = model.getObjectByName('Pupil_L');
        pupilR = model.getObjectByName('Pupil_R');

        if (!head || !eyeL || !eyeR || !pupilL || !pupilR) {
          showError('O GLB abriu, mas algum objeto não foi encontrado. Confira: Head, Eye_L, Eye_R, Pupil_L e Pupil_R.');
          return;
        }

        assignMaterial(head, materials.head);
        assignMaterial(eyeL, materials.eyes);
        assignMaterial(eyeR, materials.eyes);
        assignMaterial(pupilL, materials.pupils);
        assignMaterial(pupilR, materials.pupils);

        // Como Head contém olhos/pupilas, reaplica os materiais específicos.
        assignMaterial(eyeL, materials.eyes);
        assignMaterial(eyeR, materials.eyes);
        assignMaterial(pupilL, materials.pupils);
        assignMaterial(pupilR, materials.pupils);

        base.headRotation.copy(head.rotation);
        base.eyeLRotation.copy(eyeL.rotation);
        base.eyeRRotation.copy(eyeR.rotation);
        base.eyeLScale.copy(eyeL.scale);
        base.eyeRScale.copy(eyeR.scale);
        // As pupilas foram exportadas deslocadas no plano local dos olhos.
        // Usamos o centro local do olho como posição neutra e preservamos
        // apenas a distância frontal (eixo Y local) para evitar z-fighting.
        base.pupilLPosition.set(0, pupilL.position.y, 0);
        base.pupilRPosition.set(0, pupilR.position.y, 0);

        pupilL.position.copy(base.pupilLPosition);
        pupilR.position.copy(base.pupilRPosition);

        fitCameraToObject(modelRoot);
        scheduleBlink(performance.now() / 1000);
      },
      undefined,
      () => showError('Não foi possível carregar head.glb. Abra o projeto através de um servidor ou hospede a pasta online.')
    );

    function setSection(value) {
      section = ['motion', 'vfx', 'center'].includes(value) ? value : 'center';
    }

    // Permite testar via URL: ?state=motion, ?state=vfx ou ?state=center.
    setSection(params.get('state') || 'center');

    document.querySelectorAll('[data-state]').forEach((button) => {
      button.addEventListener('click', () => setSection(button.dataset.state));
    });

    // Cursor dentro do iframe.
    window.addEventListener('pointermove', (event) => {
      pointer.x = THREE.MathUtils.clamp((event.clientX / innerWidth) * 2 - 1, -1, 1);
      pointer.y = THREE.MathUtils.clamp(-((event.clientY / innerHeight) * 2 - 1), -1, 1);
    }, { passive: true });

    window.addEventListener('pointerleave', () => pointer.set(0, 0));

    // Cursor enviado pelo Cargo e estados do menu.
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'bruno-pointer') {
        pointer.x = THREE.MathUtils.clamp(Number(data.x) || 0, -1, 1);
        pointer.y = THREE.MathUtils.clamp(Number(data.y) || 0, -1, 1);
      }

      if (data.type === 'bruno-character') {
        setSection(data.state);
      }
    });

    function scheduleBlink(now) {
      nextBlinkAt = now + THREE.MathUtils.randFloat(
        CONFIG.blinkMinSeconds,
        CONFIG.blinkMaxSeconds
      );
    }

    function updateBlink(now) {
      if (!CONFIG.blinkEnabled || !eyeL || !eyeR) return;

      if (blinkStartedAt < 0 && now >= nextBlinkAt) blinkStartedAt = now;

      if (blinkStartedAt >= 0) {
        const t = (now - blinkStartedAt) / .18;
        if (t >= 1) {
          blinkAmount = 0;
          blinkStartedAt = -1;
          scheduleBlink(now);
        } else {
          // 0 → 1 → 0
          blinkAmount = Math.sin(Math.PI * t);
        }
      }

      const factor = THREE.MathUtils.lerp(1, .08, blinkAmount);
      eyeL.scale.set(base.eyeLScale.x, base.eyeLScale.y * factor, base.eyeLScale.z);
      eyeR.scale.set(base.eyeRScale.x, base.eyeRScale.y * factor, base.eyeRScale.z);
    }

    function damp(current, target, speed, delta) {
      return THREE.MathUtils.damp(current, target, speed, delta);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), .05);
      const now = performance.now() / 1000;

      if (head && eyeL && eyeR) {
        const sectionBias = section === 'motion'
          ? -CONFIG.sectionYaw
          : section === 'vfx'
            ? CONFIG.sectionYaw
            : 0;

        const targetHeadYaw = sectionBias + pointer.x * CONFIG.cursorYaw;
        const targetHeadPitch = pointer.y * CONFIG.cursorPitch;

        currentHead.x = damp(currentHead.x, targetHeadYaw, CONFIG.headSmooth, delta);
        currentHead.y = damp(currentHead.y, targetHeadPitch, CONFIG.headSmooth, delta);

        currentEyes.x = damp(
          currentEyes.x,
          pointer.x * CONFIG.eyeExtraYaw,
          CONFIG.eyeSmooth,
          delta
        );
        currentEyes.y = damp(
          currentEyes.y,
          pointer.y * CONFIG.eyeExtraPitch,
          CONFIG.eyeSmooth,
          delta
        );

        // Seu modelo olha para +X: yaw em Y e pitch em Z.
        head.rotation.y = base.headRotation.y + currentHead.x;
        head.rotation.z = base.headRotation.z + currentHead.y;

        // Os olhos giram apenas muito pouco. O movimento principal acontece
        // nas pupilas, deslocadas diretamente sobre os planos dos olhos.
        eyeL.rotation.y = base.eyeLRotation.y + currentEyes.x * 0.16;
        eyeR.rotation.y = base.eyeRRotation.y + currentEyes.x * 0.16;
        eyeL.rotation.z = base.eyeLRotation.z + currentEyes.y * 0.16;
        eyeR.rotation.z = base.eyeRRotation.z + currentEyes.y * 0.16;

        const sectionPupilBias = section === 'motion'
          ? -CONFIG.pupilSectionBias
          : section === 'vfx'
            ? CONFIG.pupilSectionBias
            : 0;

        // A câmera olha ao longo de -X. Na hierarquia exportada pelo Blender,
        // o plano do olho usa os eixos locais X/Z para se mover pela face.
        const pupilScreenX = THREE.MathUtils.clamp(
          pointer.x * CONFIG.pupilTravel + sectionPupilBias,
          -CONFIG.pupilTravel,
          CONFIG.pupilTravel
        );
        const pupilScreenY = THREE.MathUtils.clamp(
          pointer.y * CONFIG.pupilTravel * 0.72,
          -CONFIG.pupilTravel * 0.72,
          CONFIG.pupilTravel * 0.72
        );

        const localX = (pupilScreenX - pupilScreenY) * 0.70710678;
        const localZ = (-pupilScreenX - pupilScreenY) * 0.70710678;

        pupilL.position.x = damp(
          pupilL.position.x,
          base.pupilLPosition.x + localX,
          CONFIG.eyeSmooth,
          delta
        );
        pupilL.position.z = damp(
          pupilL.position.z,
          base.pupilLPosition.z + localZ,
          CONFIG.eyeSmooth,
          delta
        );

        pupilR.position.x = damp(
          pupilR.position.x,
          base.pupilRPosition.x + localX,
          CONFIG.eyeSmooth,
          delta
        );
        pupilR.position.z = damp(
          pupilR.position.z,
          base.pupilRPosition.z + localZ,
          CONFIG.eyeSmooth,
          delta
        );

        // Mantém a profundidade original para evitar z-fighting ou atravessar o olho.
        pupilL.position.y = base.pupilLPosition.y;
        pupilR.position.y = base.pupilRPosition.y;

        // Idle mínimo para não parecer congelado.
        modelRoot.position.y = Math.sin(now * 1.25) * .012;

        updateBlink(now);
      }

      renderer.render(scene, camera);
    }

    function resize() {
      const width = Math.max(innerWidth, 1);
      const height = Math.max(innerHeight, 1);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    addEventListener('resize', resize);
    resize();
    animate();
  </script>
</body>
</html>
